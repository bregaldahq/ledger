name: CI/CD - Pipeline Integrado de Entrega Contínua

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bregaldahq/ledger

jobs:
  # ============================================================================
  # 1. INTEGRAÇÃO CONTÍNUA (CI): BACKEND
  # ============================================================================
  backend-ci:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Suíte de Testes (Pytest)
        run: |
          python -m pytest backend/tests -v --tb=short

  # ============================================================================
  # 2. INTEGRAÇÃO CONTÍNUA (CI): FRONTEND
  # ============================================================================
  frontend-ci:
    name: Frontend CI (TypeScript & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: |
          cd frontend
          npm ci

      - name: Compilar Produção (Typecheck & Build)
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 3. AUDITORIA DE SEGURANÇA & BLINDAGEM ZERO-KEYS
  # ============================================================================
  security-audit:
    name: Auditoria de Segurança & Blindagem Zero-Keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências e Compilar Bundle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd frontend && npm ci && npm run build

      - name: Executar Auditoria de Segurança
        run: |
          python -m pytest backend/tests/test_security.py -v

  # ============================================================================
  # 4. ENTREGA CONTÍNUA (CD): PUBLICAR IMAGEM DOCKER NO GHCR
  # ============================================================================
  publish-docker:
    name: Publicar Imagem Backend (GHCR)
    needs: [backend-ci, frontend-ci, security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construir e Publicar Contêiner Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 5. ENTREGA CONTÍNUA (CD): DEPLOY FRONTEND NO GITHUB PAGES
  # ============================================================================
  deploy-github-pages:
    name: Deploy Frontend (GitHub Pages)
    needs: [frontend-ci, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar Frontend com Base Relativa
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================================
  # 6. ENTREGA CONTÍNUA (CD): CLOUDFLARE PAGES (OPCIONAL VIA SECRET)
  # ============================================================================
  deploy-cloudflare:
    name: Deploy Frontend (Cloudflare Pages)
    needs: [frontend-ci, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar Frontend para Cloudflare
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL || 'https://api.ledger.bregalda.com' }}

      - name: Publicar no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=ledger --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ============================================================================
  # 7. ENTREGA CONTÍNUA (CD): RENDER BACKEND (OPCIONAL VIA WEBHOOK)
  # ============================================================================
  deploy-render:
    name: Acionar Deploy Backend (Render Webhook)
    needs: [publish-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Notificar Deploy Hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
